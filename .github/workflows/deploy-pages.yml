name: Deploy Vault Pages
on:
  workflow_dispatch:     # 手动触发，无 cron —— 更稳定

permissions:
  contents: write          # gh-pages 分支需要 push 权限
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install StarLink
        run: |
          pip install --upgrade pip
          pip install .

      - name: Sync and generate pages
        run: star-vault sync --with-pages --no-ai
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./vault
          force_orphan: true          # 每次单 commit，不堆积历史
