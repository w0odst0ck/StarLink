name: Deploy Vault Pages
on:
  push:
    branches: [main]
  workflow_dispatch:     # 手动触发兜底

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate site-data (vault/stars → site-data.json)
        run: python -m star_vault pages

      - name: Sanity check site-data
        run: |
          python -c "
          import json
          d = json.load(open('vault/site-data.json'))
          assert d['version'] == 3, f'version={d[\"version\"]}'
          assert d['stats']['total'] > 0, 'no notes generated'
          print(f\"OK: {d['stats']['total']} notes, {len(d['tables'])} tables\")
          "

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./vault
          force_orphan: true
